<header class="sticky top-0 z-30 bg-ink/90 backdrop-blur border-b border-line" style="top:env(safe-area-inset-top)">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <a href="/" class="flex items-center gap-2 font-extrabold"><img src="/static/icons/icon-192.png" class="w-7 h-7 rounded-lg" alt="">SafeRoad</a>
    <div class="flex items-center gap-2">
      <button id="enable-push" class="btn btn-amber text-xs py-2 px-3" onclick="SafeRoad.enablePush()">🔔 Enable alerts</button>
      <button class="btn btn-ghost text-xs py-2 px-3 install-btn" onclick="SafeRoad.install()">⬇ Install</button>
      <a href="/logout" class="text-xs text-gray-400 px-2" title="Log out">{{ user.name.split(' ')[0] }} ↗</a>
    </div>
  </div>
</header>
